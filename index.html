<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Lobster&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okele Club</title>
    <link rel="shortcut icon" href="images/restaurant-logo-png-favpng-p0qdMJe2rC3e2J1DEAF0HbZzF.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h2>OKELE & CO.</h2>
        <div class="nav-links">
            <li>
                <label for="home">Home</label>
            </li>

            <li>
                <label for="menu">Menu</label>
            </li>

            <li>
                <label for="about">About</label>
            </li>

            <li>
                <label for="catering">Shop</label>
            </li>
        </div>
        <div></div>
    </nav>

    <div class="slide-container">
        <input name="nav-link" id="home" type="radio" checked>
        <input name="nav-link" id="menu" type="radio">
        <input name="nav-link" id="about" type="radio">
        <input name="nav-link" id="catering" type="radio">
        <div class="slide-track">
            <div class="hero-container">
                <div class="hero-section">
                    <div class="hero-text">
                        <h2>THE ULTIMATE</h2>
                        <h1>Òkèlè Club</h1>
                        <h4>Savor the Tradition, Join the Club!</h4>
                    </div>

                    <div class="hero-img">
                        <img src="/images/ChatGPT Image Aug 6, 2026, 09_38_07 AM.png" alt="">
                    </div>
                </div>
                <div class="img-list">
                    <img src="/images/images_-_jollof_rice.jpg" alt="">
                    <img src="/images/a-plate-of-stacked-suya-beef-copy.jpg" alt="">
                    <img src="/images/beef suya.webp" alt="">
                    <img src="images/images amala and ewedu.jpg">
                </div>
            </div>

            <div class="menu-container">
                <h2>MENU</h2>
                <div class="dish-container">
                    <div class="dish dish-one">
                        <img src="/images/menu/ChatGPT Image Aug 6, 2026, 10_55_50 AM.png" alt="">
                        <p class="dish-name">AMALA</p>
                    </div>

                    <div class="dish dish-two">
                        <img src="/images/menu/ofada-rice-and-egg.png" alt="">
                        <p class="dish-name">OFADA</p>
                    </div>

                    <div class="dish dish-three">
                        <img src="/images/menu/semo, efo and ponmo.png" alt="">
                        <p class="dish-name">SEMO</p>
                    </div>

                    <div class="dish dish-four">
                        <img src="images/menu/ChatGPT Image Aug 6, 2026, 11_27_32 AM.png" alt="">
                        <p class="dish-name">RICE & BEANS</p>
                    </div>

                    <div class="dish dish-five">
                        <img src="" alt="">
                        <p class="dish-name"></p>
                    </div>

                    <div class="dish dish-six">
                        <img src="" alt="">
                        <p class="dish-name"></p>
                    </div>

                    <div class="dish dish-seven">
                        <img src="" alt="">
                        <p class="dish-name"></p>
                    </div>

                    <div class="dish dish-eight">
                        <img src="" alt="">
                        <p class="dish-name"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="page-dots">
        <div class="dot dot-one"></div>
        <div class="dot dot-two"></div>
        <div class="dot dot-three"></div>
    </div>

</body>
<script src="style.js"></script>

</html>
